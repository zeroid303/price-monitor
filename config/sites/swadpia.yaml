# 성원애드피아(www.swadpia.co.kr) 사이트 기술 상수.

name: "성원애드피아"
base_url: "https://www.swadpia.co.kr"
tech: "playwright"
vat_included: false        # tr.estimate_supply_amt td.price 에서 공급가만 추출
locale: "ko-KR"

browser:
  headless: true
  viewport:
    width: 1280
    height: 900

block_patterns:
  - "**/google-analytics.com/**"
  - "**/googletagmanager.com/**"
  - "**/facebook.net/**"
  - "**/facebook.com/tr/**"
  - "**/doubleclick.net/**"
  - "**/criteo.net/**"
  - "**/criteo.com/**"
  - "**/analytics.tiktok.com/**"

# 오프셋 명함 — CNC1000~CNC6000
# 페이지 구조: paper_code select + coating radio + paper_size/print_color_type/paper_qty_select select
card_offset:
  selectors:
    paper_code:        "select[name=paper_code]"
    paper_size:        "select[name=paper_size]"
    color_mode:        "select[name=print_color_type]"
    qty:               "select[name=paper_qty]"           # 오프셋 페이지는 paper_qty 가 사용자 select
    coating_gloss:     "input[type=radio][name=paper_gloss]"    # 무광/유광
    coating_gloss2:    "input[type=radio][name=paper_gloss2]"   # 무광/코팅없음
    price_supply:      "tr.estimate_supply_amt td.price"        # 공급가 (₩X,XXX 텍스트)
  timeouts:
    page_goto_ms: 30000
    after_goto_ms: 2500
    after_select_ms: 600
    after_qty_ms: 400
    after_price_trigger_ms: 700
    retry_price_ms: 1500
  low_price_guard:
    floor_abs: 500
    per_qty_multiplier: 3

# 디지털 명함 — COD1000
# 페이지 구조: paper_type select + paper_code select (동적) + size/color/qty select. coating 없음.
card_digital:
  selectors:
    paper_type:        "select[name=paper_type]"
    paper_code:        "select[name=paper_code]"
    paper_size:        "select[name=paper_size]"
    color_mode:        "select[name=print_color_type]"
    qty:               "select[name=paper_qty_select]"
    price_supply:      "tr.estimate_supply_amt td.price"
  timeouts:
    page_goto_ms: 30000
    after_goto_ms: 2500
    after_select_ms: 600
    after_qty_ms: 400
    after_price_trigger_ms: 700
    retry_price_ms: 1500
  low_price_guard:
    floor_abs: 500
    per_qty_multiplier: 3

# 봉투 — CEV1000 대중소봉투 (단면4도 칼라 전용. 흑백/기성형은 수집 안 함)
# paper_kind → paper_type → paper_code 3단 cascade. 도수 = cal_line BDC40 고정.
# 가격: #print_estimate_tot (VAT 포함 → vat_included=true 로 raw 저장)
envelope:
  selectors:
    bongto_kind:   "select[name=bongto_kind]"     # CE1=규격형 고정
    bongto_type:   "select[name=bongto_type]"     # 사이즈 코드 (CE101=대 / CE103=9절 / CE102=소)
    paper_kind:    "select[name=paper_kind]"
    paper_type:    "select[name=paper_type]"
    paper_code:    "select[name=paper_code]"
    paper_qty:     "select[name=paper_qty]"
    cal_line:      "select[name=cal_line]"        # 단면칼라4도 (BDC40)
    price_total:   "#print_estimate_tot"          # 총 합계 (VAT 포함)
  timeouts:
    page_goto_ms: 30000
    after_goto_ms: 2500
    after_select_ms: 700
    after_price_trigger_ms: 800
    retry_price_ms: 1500

# 사각형 스티커 (오프셋/합판) — CST1000/GST1001 페이지
# 사이즈 input W/H (cut_x_size/cut_y_size), paper_code select 11옵션, paper_qty select
# 가격: tr.estimate_print 또는 #print_estimate_tot (VAT 포함)
sticker_offset:
  selectors:
    paper_code:       "select[name=paper_code]"        # 11옵션 (75아트/아트지 90g 초강접/유포지/모조지/크라프트/투명/은데드롱 등)
    print_color_type: "select[name=print_color_type]"  # SPD10 단면칼라(4도) / +금별 / +은별
    coating_type:     "select[name=coating_type]"      # COT70 유광써멀라미네팅 / 무광 / 코팅없음
    sticker_ink:      "select[name=sticker_ink]"       # INK10 일반잉크 / INK20 내광
    paper_qty:        "select[name=paper_qty]"         # 36옵션 (500~)
    cut_x_size:       "input[name=cut_x_size]"         # 사이즈 가로 mm 입력
    cut_y_size:       "input[name=cut_y_size]"         # 사이즈 세로 mm 입력
    price_total:      "#print_estimate_tot"            # VAT 포함 합계 텍스트
  timeouts:
    page_goto_ms: 30000
    after_goto_ms: 2500
    after_select_ms: 700
    after_size_input_ms: 1000
    after_price_trigger_ms: 800
    retry_price_ms: 1500

# 디지털/인디고 스티커 — CDP1200/GDP1201 페이지
# paper_code 6옵션 (75아트/한지/리커버/유포지/PET 등). 사이즈는 size_type=SZT20(직접입력)
# 후 cut_x_size/cut_y_size input. paper_qty 100매 가능.
sticker_digital:
  selectors:
    paper_code:       "select[name=paper_code]"
    print_color_type: "select[name=print_color_type]"  # DPD20 단면칼라4도
    coating_type:     "select[name=coating_type]"
    paper_qty:        "select[name=paper_qty]"
    size_type:        "select[name=size_type]"          # SZT10 규격 / SZT20 직접입력
    cut_x_size:       "input[name=cut_x_size]"
    cut_y_size:       "input[name=cut_y_size]"
    price_total:      "#print_estimate_tot"
  timeouts:
    page_goto_ms: 30000
    after_goto_ms: 2500
    after_select_ms: 700
    after_size_input_ms: 1000
    after_price_trigger_ms: 800
    retry_price_ms: 1500

# 합판 전단지
flyer:
  selectors:
    paper_type: select[name=paper_type]
    paper_code: select[name=paper_code]
    paper_size: select[name=paper_size]
    paper_qty: select[name=paper_qty]
    fside_color_amount: select[name=fside_color_amount]
    bside_color_amount: select[name=bside_color_amount]
    price_supply: tr.estimate_supply_amt td.price
  timeouts:
    page_goto_ms: 30000
    after_goto_ms: 2500
    after_select_ms: 600
    after_qty_ms: 400
    after_price_trigger_ms: 700
    retry_price_ms: 1500
  low_price_guard:
    floor_abs: 5000
    per_qty_multiplier: 5
