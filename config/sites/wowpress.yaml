# 와우프레스(wowpress.co.kr) 사이트 기술 상수.

name: "와우프레스"
base_url: "https://wowpress.co.kr"
tech: "playwright"
vat_included: false        # raw 에 공급가(VAT 제외) 만 기록 — od_00_totalcost - od_00_taxcost 로 계산
locale: "ko-KR"

browser:
  headless: true
  viewport:
    width: 1280
    height: 900

block_patterns:
  - "**/google-analytics.com/**"
  - "**/googletagmanager.com/**"
  - "**/facebook.net/**"
  - "**/facebook.com/tr/**"
  - "**/doubleclick.net/**"
  - "**/criteo.net/**"
  - "**/criteo.com/**"
  - "**/analytics.tiktok.com/**"

# 명함 페이지 공통 구조 (offset/digital 동일):
#   pdata_00_sizeno · pdata_00_colorno · spdata_00_paperno3/4(/5) · spdata_00_ordqty
#   가격: od_00_prscost(공급가) / od_00_taxcost(부가세) / od_00_totalcost(합계)
#   - 공급가 = totalcost - taxcost (addon 항목 변동에 안전)
card_offset:
  selectors:
    size:        "pdata_00_sizeno"
    color_mode:  "pdata_00_colorno"
    paper_no3:   "spdata_00_paperno3"
    paper_no4:   "spdata_00_paperno4"
    paper_no5:   "spdata_00_paperno5"
    qty:         "spdata_00_ordqty"
    paper_list:  "paperList"          # leaf paper_no → 부모 체인 추출용 JSON
    price_total: "od_00_totalcost"
    price_tax:   "od_00_taxcost"
    price_supply: "od_00_prscost"     # 참조용 (필요시 cross-check)
  timeouts:
    page_goto_ms: 30000
    after_goto_ms: 2500
    after_select_ms: 800
    after_paper_ms: 800
    after_qty_ms: 1200
    retry_price_ms: 1500
  low_price_guard:
    floor_abs: 500
    per_qty_multiplier: 3

card_digital:
  selectors:
    size:        "pdata_00_sizeno"
    color_mode:  "pdata_00_colorno"
    paper_no3:   "spdata_00_paperno3"
    paper_no4:   "spdata_00_paperno4"
    paper_no5:   "spdata_00_paperno5"
    qty:         "spdata_00_ordqty"
    paper_list:  "paperList"
    price_total: "od_00_totalcost"
    price_tax:   "od_00_taxcost"
    price_supply: "od_00_prscost"
  timeouts:
    page_goto_ms: 30000
    after_goto_ms: 2500
    after_select_ms: 800
    after_paper_ms: 800
    after_qty_ms: 1200
    retry_price_ms: 1500
  low_price_guard:
    floor_abs: 500
    per_qty_multiplier: 3

# 사각형 스티커 (오프셋/합판) — linkProdNo=40133 카테고리의 13 하위 제품 (paper 종류별 분리)
# config/targets/sticker.yaml wowpress 섹션의 13 ProdNo 별 dets 페이지 진입.
# 각 제품 페이지는 봉투(40034) 와 유사: paperno3/4/5 cascade + sizeno or width/height input.
# 일부 제품은 사이즈가 select(sizeno), 일부는 사용자 정의 input (paperwidth/paperheight).
sticker_offset:
  selectors:
    size:        "pdata_00_sizeno"
    color_mode:  "pdata_00_colorno"
    paper_no3:   "spdata_00_paperno3"
    paper_no4:   "spdata_00_paperno4"
    paper_no5:   "spdata_00_paperno5"
    qty:         "spdata_00_ordqty"
    ord_cnt:     "pdata_00_ordcnt"
    width_input: "spdata_00_paperwidth"   # 사용자 정의 폭 mm
    height_input: "spdata_00_paperheight" # 사용자 정의 높이 mm
    paper_list:  "paperList"
    price_total: "od_00_totalcost"
    price_tax:   "od_00_taxcost"
    price_supply: "od_00_prscost"
  timeouts:
    page_goto_ms: 30000
    after_goto_ms: 6000
    after_size_ms: 6000
    after_select_ms: 800
    after_paper_ms: 2200
    after_qty_ms: 500
    after_summary_ms: 2000
    retry_price_ms: 1500

# 디지털 스티커 — 소량스티커 시리즈 (40009/40011/40475 등) 8 제품
# 봉투 paperno3/4/5 cascade 와 유사. paperno5 없는 2단 cascade 동적 처리.
# qty=100 매 표준 (offset 의 1000 과 다름).
sticker_digital:
  selectors:
    size:        "pdata_00_sizeno"
    color_mode:  "pdata_00_colorno"
    paper_no3:   "spdata_00_paperno3"
    paper_no4:   "spdata_00_paperno4"
    paper_no5:   "spdata_00_paperno5"
    qty:         "spdata_00_ordqty"
    ord_cnt:     "pdata_00_ordcnt"
    paper_list:  "paperList"
    price_total: "od_00_totalcost"
    price_tax:   "od_00_taxcost"
    price_supply: "od_00_prscost"
  timeouts:
    page_goto_ms: 30000
    after_goto_ms: 6000
    after_size_ms: 6000
    after_select_ms: 800
    after_paper_ms: 2200
    after_qty_ms: 500
    after_summary_ms: 2000
    retry_price_ms: 1500

# 봉투 — 칼라봉투(40034) / 마스타봉투 단면흑백(40035)
# 사이즈 변경 → reqMdmDetail AJAX 5~6초 대기 → paperno3 갱신
# 용지: paperno3 → paperno4(색상) → paperno5(평량) 3단 cascade
# 가격: od_00_totalcost (VAT 포함) — 공급가 = totalcost - taxcost
envelope:
  selectors:
    size:        "pdata_00_sizeno"
    color_mode:  "pdata_00_colorno"
    paper_no3:   "spdata_00_paperno3"
    paper_no4:   "spdata_00_paperno4"
    paper_no5:   "spdata_00_paperno5"
    qty:         "spdata_00_ordqty"
    ord_cnt:     "pdata_00_ordcnt"
    paper_list:  "paperList"
    price_total: "od_00_totalcost"
    price_tax:   "od_00_taxcost"
    price_supply: "od_00_prscost"
  timeouts:
    page_goto_ms: 30000
    after_goto_ms: 6000          # 첫 로드 후 옵션 트리 안정화
    after_size_ms: 6000          # reqMdmDetail AJAX paperno3 갱신
    after_select_ms: 800
    after_paper_ms: 2200          # paperno3/4/5 단계 전환 (AJAX)
    after_qty_ms: 500
    after_summary_ms: 2000       # fnOrdSummary 가격 계산
    retry_price_ms: 1500

# 합판 전단지
flyer:
  selectors:
    size: pdata_00_sizeno
    color_mode: pdata_00_colorno
    paper_no3: spdata_00_paperno3
    paper_no4: spdata_00_paperno4
    qty: spdata_00_ordqty
    paper_list: paperList
    price_total: od_00_totalcost
    price_tax: od_00_taxcost
    price_supply: od_00_prscost
  timeouts:
    page_goto_ms: 30000
    after_goto_ms: 2500
    after_select_ms: 800
    after_paper_ms: 800
    after_qty_ms: 1200
    retry_price_ms: 1500
  low_price_guard:
    floor_abs: 5000
    per_qty_multiplier: 5
