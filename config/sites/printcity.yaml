# 프린트시티 사이트 메타.
# 카드/봉투/전단: data/printcity/*.xlsx 정적 source.
# 스티커: 사각형 스티커는 가격 정책 복잡 → StickerRectangleNew 페이지 Playwright 크롤.

name: "프린트시티"
base_url: "https://www.printcity.co.kr"
tech: "xlsx"             # 카드/봉투/전단 — 엑셀 직접 파싱.
ownership: "self"        # 자사 — 가격 기준(reference)
vat_included: false      # 엑셀 value 컬럼은 공급가(VAT 제외)
locale: "ko-KR"

browser:
  headless: true
  viewport:
    width: 1280
    height: 900

block_patterns:
  - "**/google-analytics.com/**"
  - "**/googletagmanager.com/**"
  - "**/facebook.net/**"
  - "**/facebook.com/tr/**"
  - "**/doubleclick.net/**"

# 사각형 스티커 — StickerRectangleNew 페이지 Playwright 크롤링 (xlsx 없음).
sticker:
  tech: "playwright"
  vat_included: true
  selectors:
    material_code:            "#materialCode"           # paper (7옵션: 아트스티커/유포지/모조지/크라프트/투명데드롱/은데드롱)
    coating_code:             "#coatingCode"            # COT:NO/MS/GS/SRB
    color_code:               "#colorCode"              # COL:40 단면4도 (1옵션 고정)
    size_kind_code:           "#sizeKind_code"          # standardSize / customSize
    size_code:                "#sizeCode"               # 14옵션 (SIZ:ST-60x40 ~ 90X120)
    sticker_touch_margin:     "#stickerTouchMarginCode" # STM:TWO 배경있음 / STM:ONE 배경없음
    quantity:                 "#quantities"             # 매수 select (1000)
    case_count:               "#case_counts"            # 건수 (1)
    price_total:              "#SumTotalPrice"          # 5,500 표시 (React-controlled)
    price_view:               "div.price_view"           # 부가세/제품금액 포함 텍스트
  timeouts:
    page_goto_ms: 30000
    after_goto_ms: 3000
    after_select_ms: 700
    after_price_trigger_ms: 1500
    retry_price_ms: 1500
