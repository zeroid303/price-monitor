# 프린트시티 사이트 메타.
# 카드/봉투/전단: data/printcity/*.xlsx 정적 source.
# 스티커: 사각형 스티커는 가격 정책 복잡 → StickerRectangleNew 페이지 Playwright 크롤.

name: "프린트시티"
base_url: "https://www.printcity.co.kr"
tech: "xlsx"             # 카드/봉투/전단 — 엑셀 직접 파싱.
ownership: "self"        # 자사 — 가격 기준(reference)
vat_included: false      # 엑셀 value 컬럼은 공급가(VAT 제외)
locale: "ko-KR"

browser:
  headless: true
  viewport:
    width: 1280
    height: 900

block_patterns:
  - "**/google-analytics.com/**"
  - "**/googletagmanager.com/**"
  - "**/facebook.net/**"
  - "**/facebook.com/tr/**"
  - "**/doubleclick.net/**"

# 사각형 스티커 — StickerRectangleNew 페이지 Playwright 크롤링 (xlsx 없음).
sticker:
  tech: "playwright"
  vat_included: true
  selectors:
    paper_code:               "#paperCode"           # paper (추가 dump 필요 — 디스커버리 시 못 본 셀렉터)
    coating_code:             "#coatingCode"         # COT:NO/MS/GS/SRB
    color_code:               "#colorCode"           # COL:40 단면4도 고정
    size_kind_code:           "#sizeKind_code"       # standardSize / customSize
    size_code:                "#sizeCode"            # 14옵션 (SIZ:ST-60x40 ~ 90X120)
    sticker_touch_margin:     "#stickerTouchMarginCode"  # 배경있음/없음
    paper_qty:                "#paperQty"            # 매수 (확인 필요)
    width:                    'input[name="width"]'      # custom 폭
    height:                   'input[name="height"]'     # custom 높이
    price_total:              "div.SumTotalPrice"    # '5,500' 표시
    price_view:               "div.price_view"        # 부가세/제품금액 포함 텍스트
  timeouts:
    page_goto_ms: 30000
    after_goto_ms: 3000
    after_select_ms: 700
    after_price_trigger_ms: 1500
    retry_price_ms: 1500
